plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Full version is <mod_version>+<minecraft_version>, e.g. 1.0.0+26.3 (SemVer build metadata).
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Exclude development only files from the finished jar
    exclude("**/*.bbmodel") // BlockBench project files
}

repositories {
    // Hibiscus Lib (docs/DEPENDING.md in its repository). GitHub Packages needs a token even for public packages.
    maven {
        name = 'HibiscusLib'
        url = 'https://maven.pkg.github.com/hibiscus-software/hibiscus-lib'
        credentials {
            // Locally: gpr.user / gpr.key in ~/.gradle/gradle.properties (a token with read:packages).
            // In GitHub Actions: the workflow's GITHUB_ACTOR and GITHUB_TOKEN.
            username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
            password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
        }
        content { includeGroup 'software.hibiscus.hibiscuslib' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    // applies to all the run configs below
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    // Runs every registered gametest, then exits: ./gradlew runGameTestServer
    gameTestServer {
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// Use it instead of 'runtimeOnly' for dependencies that should be present when testing
// but that are not published as dependencies of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // The GUI theme the HUD draws with. Loaded as a mod in dev runs.
    implementation "software.hibiscus.hibiscuslib:hibiscuslib:${hibiscuslib_version}"
}

// Expands the declared properties in neoforge.mods.toml using ${} Groovy notation.
// A missing property will result in an error.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Ship the MIT license inside the mod jar.
tasks.named('jar', Jar).configure {
    def licenseName = "LICENSE_${mod_id}"
    from('LICENSE') {
        rename { licenseName }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
