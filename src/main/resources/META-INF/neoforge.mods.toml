license="${mod_license}"
issueTrackerURL="https://github.com/hibiscus-software/hibiscus-faultline/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hibiscus Software"
displayURL="https://github.com/hibiscus-software/hibiscus-faultline"
# Square icon beside the name in the mod list; wide banner at the top of the info panel. Both are pixel art, so no blur.
iconFile="hibiscusfaultline_icon.png"
iconBlur=false
bannerFile="hibiscusfaultline_banner.png"
logoBlur=false
description='''
Mine a whole vein at once. Hold the Faultline key and break a block to take out every matching block connected to it: ores, logs, stone, anything. It works with any tool or your bare hand, and the config lets you set the limits.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The HUD draws with Hibiscus Lib's theme.
[[dependencies.${mod_id}]]
    modId="hibiscuslib"
    type="required"
    versionRange="[1.4.1,)"
    ordering="AFTER"
    side="BOTH"
